<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考勤管理 · 月度汇总</title>
<style>
:root{
  --primary:#3B82F6;
  --primary-hover:#2563EB;
  --primary-light:#EFF6FF;
  --danger:#EF4444;
  --danger-light:#FEF2F2;
  --success:#10B981;
  --bg:#F8FAFC;
  --surface:#FFFFFF;
  --border:#C3D4E8;
  --grid:#B9CBDF;          /* 表格格子线颜色 */
  --head-deep:#1E4ED8;     /* 表头分组行 */
  --head:#3B82F6;          /* 表头列名行 */
  --zebra:#F3F8FE;         /* 隔行底色 */
  --zebra-name:#DFECFA;    /* 隔行姓名列底色 */
  --name-tint:#E7F1FC;     /* 姓名列底色 */
  --hover:#DDECFB;         /* 悬停底色 */
  --total-bg:#FFEFC2;      /* 合计行底色 */
  --text:#1E293B;
  --text-secondary:#64748B;
  --text-muted:#94A3B8;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 8px 24px rgba(0,0,0,.12);
  --radius:12px;
  --radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#D6E6F9 0%,#EAF2FC 45%,#E3EDF9 100%);
  background-attachment:fixed;
  color:var(--text);min-height:100vh;
  padding:24px 16px 60px;
}
body.no-scroll{overflow:hidden}
.app{max-width:1240px;margin:0 auto}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;color:#16335F}
.brand .badge{font-size:11px;font-weight:600;color:#fff;background:var(--primary);padding:2px 8px;border-radius:999px}
.brand .sub{font-size:12px;color:#54718F;margin-top:4px}

/* 右上角月份切换 */
.month-nav{position:relative;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:4px;flex-shrink:0}
.nav-btn{width:32px;height:32px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:17px;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;transition:all .12s}
.nav-btn:hover{background:#EDF3FA;color:var(--text)}
.month-label{min-width:120px;text-align:center;font-weight:600;font-size:14px;cursor:pointer;padding:6px 6px;border-radius:8px;user-select:none;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .12s;color:#16335F}
.month-label:hover{background:#EDF3FA}
.month-label .cal-ico{font-size:13px}

/* 日历弹层 */
.cal-pop{position:absolute;top:calc(100% + 8px);right:0;width:304px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-md);padding:14px;z-index:100}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.cal-year{font-weight:700;font-size:14px;color:#16335F}
.cal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.cal-month{padding:9px 0;border:1px solid var(--border);border-radius:8px;background:#F4F9FE;cursor:pointer;font-size:13px;color:var(--text-secondary);transition:all .12s}
.cal-month:hover{border-color:var(--primary);color:var(--primary)}
.cal-month.selected{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.cal-month.today{border-color:var(--primary);border-style:dashed}
.cal-foot{margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.cal-today-btn{font-size:12px;color:var(--primary);background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:6px}
.cal-today-btn:hover{background:var(--primary-light)}
.hidden{display:none}

/* ---------- 工具栏 ---------- */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .12s;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text-secondary)}
.btn-ghost:hover{background:#EDF3FA;color:var(--text)}
.save-hint{margin-left:auto;font-size:12px;color:#54718F}

/* ---------- 表格（格子线用 border-spacing 画出来） ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);overflow:hidden}
.table-wrap{overflow:auto;max-height:calc(100vh - 290px)}
.sheet-table{width:100%;border-collapse:separate;border-spacing:1px;background:var(--grid);font-size:13px;min-width:1180px}
.sheet-table th,.sheet-table td{padding:0;text-align:center;border:none}
.sheet-table thead th{position:sticky;top:0;z-index:3}
.sheet-table thead th.name-col{left:0;z-index:4}
.sheet-table .group-row th{background:var(--head-deep);color:#fff;font-size:12px;padding:7px;font-weight:600}
.sheet-table .col-row th{background:var(--head);color:#fff;font-size:12.5px;padding:8px 6px;font-weight:600;white-space:nowrap}
.sheet-table .col-row th .unit{font-size:10px;font-weight:400;opacity:.8;margin-left:1px}

/* 单元格底色 */
.sheet-table tbody td{background:var(--surface)}
.sheet-table tbody tr:nth-child(even) td{background:var(--zebra)}
.sheet-table tbody td.name-col,.sheet-table tbody td.ym-col{background:var(--name-tint)}
.sheet-table tbody tr:nth-child(even) td.name-col,.sheet-table tbody tr:nth-child(even) td.ym-col{background:var(--zebra-name)}
.sheet-table tbody tr:hover td{background:var(--hover)}
.sheet-table tbody tr:hover td.name-col,.sheet-table tbody tr:hover td.ym-col{background:var(--hover)}

/* 姓名列 / 年月列（左固定） */
th.name-col,td.name-col,th.ym-col,td.ym-col{position:sticky;left:0;text-align:left;min-width:140px}
.name-cell{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 10px;min-height:38px;cursor:pointer}
.name-cell .n-wrap{display:flex;align-items:center;gap:6px;overflow:hidden;font-weight:600;color:#1D4ED8}
.name-cell .n-wrap:hover{text-decoration:underline}
.name-cell .n-ico{flex-shrink:0;font-size:13px}
.name-cell .n-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name-cell .n-hint{font-size:10px;color:var(--text-muted);font-weight:400}
.del-btn{width:20px;height:20px;flex-shrink:0;border:none;background:transparent;color:var(--text-muted);border-radius:6px;cursor:pointer;font-size:11px;opacity:0;transition:all .12s;display:flex;align-items:center;justify-content:center}
tr:hover .del-btn{opacity:1}
.del-btn:hover{background:var(--danger-light);color:var(--danger)}

/* 输入框 */
.sheet-table td input{width:100%;border:none;background:transparent;text-align:center;padding:9px 6px;font-size:13px;color:var(--text);outline:none;font-family:inherit;font-variant-numeric:tabular-nums;min-height:38px}
.sheet-table td input:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--primary);border-radius:2px}
.sheet-table td .note-input{text-align:left;font-variant-numeric:normal}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.ym-label{padding:0 10px;min-height:38px;display:flex;align-items:center;font-weight:600;color:#16335F;white-space:nowrap;font-size:12.5px}
th.act-col,td.act-col{width:14px;min-width:14px;padding:0}
th.note-col,td.note-col{min-width:200px}
td.empty{height:140px;color:var(--text-muted);padding:24px;background:var(--surface)!important}

/* 年份分隔行（个人明细弹窗） */
.sheet-table tbody tr.year-row td{background:#D8E6F8!important;font-weight:700;color:#16335F;text-align:left;padding:7px 10px;font-size:12.5px}

/* 合计行 */
.sheet-table tfoot td{background:var(--total-bg);font-weight:700;padding:10px 6px;font-variant-numeric:tabular-nums}
.sheet-table tfoot td.name-col,.sheet-table tfoot td.ym-col{background:var(--total-bg)}
.sheet-table tfoot .total-label{padding-left:10px}

/* 表尾提示 */
.table-foot{padding:10px 16px;font-size:12px;color:#54718F;border-top:1px solid var(--border);background:#FBFDFF}

/* ---------- 成员明细弹窗 ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.modal-card{background:var(--surface);border-radius:14px;max-width:1240px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:linear-gradient(90deg,var(--head-deep),var(--primary));color:#fff}
.modal-title{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.modal-title .mt-count{font-size:11px;font-weight:500;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:999px}
.modal-close{background:rgba(255,255,255,.15);color:#fff;border:none;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;flex-shrink:0;transition:background .12s}
.modal-close:hover{background:rgba(255,255,255,.3)}
.modal-body{padding:16px 20px 20px;overflow:auto}
.modal-table-wrap{overflow:auto;max-height:calc(92vh - 190px);border:1px solid var(--grid);border-radius:10px}
@media (max-width:640px){
  .brand h1{font-size:17px}
  .topbar{flex-direction:column}
  .month-nav{align-self:flex-end}
  .save-hint{display:none}
  .modal-overlay{padding:10px}
  .modal-body{padding:10px}
}

/* ---------- PDF 导出（浏览器打印 → 另存为 PDF，无需联网） ---------- */
.print-sheet{display:none}
@page{size:A4 landscape;margin:10mm}
@media print{
  .app{display:none!important}
  .modal-overlay{display:none!important}
  .print-sheet{display:block;color:#000;background:#fff}
  body{background:#fff;padding:0}
}
.print-sheet h1{font-size:18px;text-align:center;margin-bottom:10px}
.print-sheet table{width:100%;border-collapse:collapse;font-size:11px}
.print-sheet th,.print-sheet td{border:1px solid #444;padding:4px 6px;text-align:center}
.print-sheet th{background:#E3EDF8;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.print-sheet td.ps-note{text-align:left}
.print-sheet .ps-meta{margin-top:10px;font-size:10px;color:#555;text-align:right}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>📋 考勤管理 <span class="badge">月度汇总</span></h1>
      <div class="sub">打卡异常 · 假勤统计 · 日报提交 一站式汇总（点击成员姓名可查看个人月度明细）</div>
    </div>
    <div class="month-nav" id="monthNav">
      <button class="nav-btn" id="prevBtn" title="上个月" aria-label="上个月">‹</button>
      <div class="month-label" id="monthLabel" title="点击选择月份">
        <span id="monthText">2026年9月</span><span class="cal-ico">📅</span>
      </div>
      <button class="nav-btn" id="nextBtn" title="下个月" aria-label="下个月">›</button>
      <div class="cal-pop hidden" id="calPop">
        <div class="cal-head">
          <button class="nav-btn" id="calPrevY" aria-label="上一年">‹</button>
          <span class="cal-year" id="calYear">2026年</span>
          <button class="nav-btn" id="calNextY" aria-label="下一年">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-foot">
          <span style="font-size:11px;color:var(--text-muted)">虚线框 = 本月</span>
          <button class="cal-today-btn" id="calToday">回到本月</button>
        </div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <button class="btn btn-primary" id="addBtn">＋ 添加成员</button>
    <button class="btn btn-ghost" id="exportBtn">⬇ 导出 CSV</button>
    <button class="btn btn-ghost" id="exportXlsBtn">📊 导出 Excel</button>
    <button class="btn btn-ghost" id="exportPdfBtn">📄 导出 PDF</button>
    <span class="save-hint" id="saveHint">数据仅保存在本机浏览器，无需联网</span>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table class="sheet-table" id="sheet">
        <thead>
          <tr class="group-row">
            <th class="name-col" rowspan="2">姓名</th>
            <th colspan="3">打卡异常</th>
            <th colspan="3">假勤统计</th>
            <th colspan="2">日报提交</th>
            <th rowspan="2" class="note-col">备注</th>
            <th rowspan="2" class="act-col"></th>
          </tr>
          <tr class="col-row">
            <th>补卡次数</th>
            <th>迟到次数</th>
            <th>缺卡次数</th>
            <th>调休<span class="unit">天</span></th>
            <th>病假/事假<span class="unit">天</span></th>
            <th>加班<span class="unit">小时</span></th>
            <th>日/周报应提交</th>
            <th>日/周报实际提交</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="table-foot">💾 数据自动保存在本机浏览器（localStorage），关闭页面不丢失；每月数据独立存储，右上角日历可切换月份。点击成员姓名弹出其个人月度明细（纵轴年月、横轴与本表一致）。删除成员会清空其在所有月份的数据。</div>
  </div>
</div>

<div class="print-sheet" id="printSheet"></div>

<script>
(function(){
'use strict';
/* ---------- 配置 ---------- */
var LS_ROSTER = 'kq-roster';                          // 成员名单（所有月份共用）
var LS_MONTH = 'kq:';                                  // 月度数据前缀 kq:2026-09
var COLS = [
  {key:'buka',      label:'补卡次数',      type:'int'},
  {key:'chidao',    label:'迟到次数',      type:'int'},
  {key:'queka',     label:'缺卡次数',      type:'int'},
  {key:'tiaoxiu',   label:'调休',          type:'num'},
  {key:'leave',     label:'病假/事假',     type:'num'},
  {key:'overtime',  label:'加班',          type:'num'},
  {key:'due',       label:'日/周报应提交',  type:'int'},
  {key:'submitted', label:'日/周报实际提交', type:'int'},
  {key:'note',      label:'备注',          type:'text'}
];
var NUM_KEYS = COLS.filter(function(c){return c.type!=='text';}).map(function(c){return c.key;});
var SUMMARY_COLSPAN = 11; // 姓名 + 8 数值 + 备注 + 操作

/* ---------- 工具函数 ---------- */
function $(id){ return document.getElementById(id); }
function monthKey(y,m){ return LS_MONTH + y + '-' + String(m).padStart(2,'0'); }
function loadJSON(k,fb){ try{ var v=JSON.parse(localStorage.getItem(k)); return v||fb; }catch(e){ return fb; } }
function saveJSON(k,v){ localStorage.setItem(k,JSON.stringify(v)); }
function fmtNum(v){
  if(v===''||v===null||v===undefined) return '0';
  var n=Math.round(parseFloat(v)*100)/100;
  return isNaN(n)?'0':String(n);
}

var tbody=$('tbody'), monthText=$('monthText'), calPop=$('calPop');
var today=new Date();
var cur={y:today.getFullYear(), m:today.getMonth()+1};
var calViewY=cur.y; // 日历弹层中展示的年份

var roster=loadJSON(LS_ROSTER, []);
var monthData={};

function loadMonth(){ monthData=loadJSON(monthKey(cur.y,cur.m), {}); }
function persistMonth(){ saveJSON(monthKey(cur.y,cur.m), monthData); }
function persistRoster(){ saveJSON(LS_ROSTER, roster); }

/* ---------- 保存提示 ---------- */
var hintTimer=null;
function flashSaved(){
  var el=$('saveHint');
  el.textContent='已自动保存 '+new Date().toLocaleTimeString('zh-CN',{hour12:false});
  clearTimeout(hintTimer);
  hintTimer=setTimeout(function(){ el.textContent='数据仅保存在本机浏览器，无需联网'; },3000);
}

/* ---------- 键盘导航（方向键在格子间移动，Enter 跳到下一行同列） ---------- */
function bindGridNav(inp, getTrs, rowIdx, colIdx){
  inp.addEventListener('keydown', function(ev){
    var k=ev.key;
    if(k!=='ArrowUp'&&k!=='ArrowDown'&&k!=='ArrowLeft'&&k!=='ArrowRight'&&k!=='Enter') return;
    var nr=rowIdx, nc=colIdx;
    if(k==='ArrowUp') nr--; else if(k==='ArrowDown'||k==='Enter') nr++;
    else if(k==='ArrowLeft') nc--; else if(k==='ArrowRight') nc++;
    if(ev.shiftKey&&k==='Enter') nr-=2;
    ev.preventDefault();
    var trs=getTrs();
    if(nr<0||nr>=trs.length) return;
    var inputs=trs[nr].querySelectorAll('input');
    if(nc<0||nc>=inputs.length) return;
    var target=inputs[nc];
    target.focus();
    if(target.type==='number') target.select();
  });
}
function buildInput(col, val, onInput, rowIdx, colIdx, getTrs){
  var inp=document.createElement('input');
  if(col.type==='text'){
    inp.type='text'; inp.className='note-input'; inp.maxLength=200;
  }else{
    inp.type='number'; inp.min='0'; inp.step=(col.type==='int')?'1':'0.5'; inp.inputMode='decimal';
  }
  inp.value=(val!==undefined && val!==null) ? val : '';
  inp.addEventListener('input', onInput);
  bindGridNav(inp, getTrs, rowIdx, colIdx);
  return inp;
}

/* ================= 汇总表 ================= */
function renderTable(){
  tbody.innerHTML='';
  if(roster.length===0){
    var tr=document.createElement('tr');
    var td=document.createElement('td');
    td.className='empty';
    td.colSpan=SUMMARY_COLSPAN;
    td.innerHTML='<div style="font-size:14px;margin-bottom:6px">暂无成员</div><div style="font-size:12px">点击左上角「＋ 添加成员」开始使用</div>';
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }
  roster.forEach(function(name, ri){
    var rec=monthData[name]||{};
    var tr=document.createElement('tr');

    /* 姓名列：点击弹出个人明细 */
    var tdName=document.createElement('td');
    tdName.className='name-col';
    tdName.title='点击查看 '+name+' 的月度明细';
    var div=document.createElement('div');
    div.className='name-cell';
    var wrap=document.createElement('span');
    wrap.className='n-wrap';
    wrap.innerHTML='<span class="n-ico">👤</span><span class="n-name"></span><span class="n-hint">明细›</span>';
    wrap.querySelector('.n-name').textContent=name;
    var del=document.createElement('button');
    del.className='del-btn'; del.title='删除该成员（清空所有月份数据）'; del.textContent='✕';
    del.addEventListener('click', function(ev){ ev.stopPropagation(); removePerson(name); });
    div.appendChild(wrap); div.appendChild(del);
    div.addEventListener('click', function(){ openDetail(name); });
    tdName.appendChild(div);
    tr.appendChild(tdName);

    COLS.forEach(function(col, ci){
      var td=document.createElement('td');
      var inp=buildInput(col, rec[col.key], function(){
        var d=monthData[name]||(monthData[name]={});
        d[col.key]=inp.value;      // 空字符串 = 未填写
        persistMonth();
        flashSaved();
      }, ri, ci, function(){ return tbody.querySelectorAll('tr'); });
      td.appendChild(inp);
      tr.appendChild(td);
    });

    var tdAct=document.createElement('td');
    tdAct.className='act-col';
    tr.appendChild(tdAct);

    tbody.appendChild(tr);
  });
}

/* ================= 个人月度明细弹窗 ================= */
function collectYears(){
  var map={};
  Object.keys(localStorage).forEach(function(k){
    var m=k.match(/^kq:(\d{4})-(\d{2})$/);
    if(m) map[+m[1]]=true;
  });
  /* 当前查看的年份始终包含（即使还没数据） */
  map[cur.y]=true;
  return Object.keys(map).map(Number).sort(function(a,b){ return a-b; });
}

function openDetail(name){
  var years=collectYears();
  var overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='detailModal';

  var card=document.createElement('div');
  card.className='modal-card';

  var head=document.createElement('div');
  head.className='modal-head';
  var title=document.createElement('div');
  title.className='modal-title';
  title.innerHTML='👤 <span></span> 月度明细 <span class="mt-count"></span>';
  title.querySelector('span').textContent=name;
  title.querySelector('.mt-count').textContent='共 '+years.length+' 年 · 每年1-12月';
  var close=document.createElement('button');
  close.className='modal-close'; close.title='关闭（Esc）'; close.textContent='✕';
  close.addEventListener('click', closeDetail);
  head.appendChild(title); head.appendChild(close);

  var body=document.createElement('div');
  body.className='modal-body';
  body.innerHTML=
    '<div class="modal-table-wrap">'+
      '<table class="sheet-table" style="min-width:1180px">'+
        '<thead>'+
          '<tr class="group-row">'+
            '<th class="ym-col" rowspan="2">年月</th>'+
            '<th colspan="3">打卡异常</th>'+
            '<th colspan="3">假勤统计</th>'+
            '<th colspan="2">日报提交</th>'+
            '<th rowspan="2" class="note-col">备注</th>'+
          '</tr>'+
          '<tr class="col-row">'+
            '<th>补卡次数</th><th>迟到次数</th><th>缺卡次数</th>'+
            '<th>调休<span class="unit">天</span></th><th>病假/事假<span class="unit">天</span></th><th>加班<span class="unit">小时</span></th>'+
            '<th>日/周报应提交</th><th>日/周报实际提交</th>'+
          '</tr>'+
        '</thead>'+
        '<tbody id="detailTbody"></tbody>'+
        '<tfoot id="detailTfoot"></tfoot>'+
      '</table>'+
    '</div>';

  card.appendChild(head);
  card.appendChild(body);
  overlay.appendChild(card);
  overlay.addEventListener('click', function(ev){ if(ev.target===overlay) closeDetail(); });
  document.body.appendChild(overlay);
  document.body.classList.add('no-scroll');
  renderDetailTable(name);
}

function closeDetail(){
  var el=$('detailModal');
  if(el) el.remove();
  document.body.classList.remove('no-scroll');
}

function renderDetailTable(name){
  var dtb=$('detailTbody');
  if(!dtb) return;
  dtb.innerHTML='';
  var years=collectYears();
  var getTrs=function(){ return dtb.querySelectorAll('tr.detail-month-row'); };
  var ri=0;

  years.forEach(function(y){
    /* 年份分隔行 */
    var trY=document.createElement('tr');
    trY.className='year-row';
    var tdY=document.createElement('td');
    tdY.className='year-cell';
    tdY.colSpan=10;
    tdY.textContent='📅 '+y+'年';
    trY.appendChild(tdY);
    dtb.appendChild(trY);

    /* 该年份 1-12 月全部列出 */
    for(var m=1;m<=12;m++){
      (function(mo){
        var d=loadJSON(monthKey(y,mo), {})||{};
        var rec=d[name]||{};
        var tr=document.createElement('tr');
        tr.className='detail-month-row';

        var tdYm=document.createElement('td');
        tdYm.className='ym-col';
        var lab=document.createElement('div');
        lab.className='ym-label';
        lab.textContent=mo+'月';
        tdYm.appendChild(lab);
        tr.appendChild(tdYm);

        COLS.forEach(function(col, ci){
          var td=document.createElement('td');
          var inp=buildInput(col, rec[col.key], function(){
            var dm=loadJSON(monthKey(y,mo), {})||{};
            var pr=dm[name]||(dm[name]={});
            pr[col.key]=inp.value;
            saveJSON(monthKey(y,mo), dm);
            /* 若编辑的是汇总表当前月份，同步刷新汇总表 */
            if(y===cur.y && mo===cur.m){
              monthData=dm;
              renderTable();
            }
            updateDetailTotals(name);
            flashSaved();
          }, ri, ci, getTrs);
          td.appendChild(inp);
          tr.appendChild(td);
        });

        dtb.appendChild(tr);
        ri++;
      })(m);
    }
  });
  updateDetailTotals(name);
}

function updateDetailTotals(name){
  var tfootD=$('detailTfoot');
  if(!tfootD) return;
  var sums={};
  NUM_KEYS.forEach(function(k){ sums[k]=0; });
  collectYears().forEach(function(y){
    for(var m=1;m<=12;m++){
      var d=loadJSON(monthKey(y,m), {})||{};
      var rec=d[name]||{};
      NUM_KEYS.forEach(function(k){
        var v=parseFloat(rec[k]);
        if(!isNaN(v)) sums[k]+=v;
      });
    }
  });
  tfootD.innerHTML='';
  var tr=document.createElement('tr');
  var td0=document.createElement('td');
  td0.className='ym-col total-label'; td0.textContent='合计';
  tr.appendChild(td0);
  COLS.forEach(function(col){
    var td=document.createElement('td');
    if(col.type!=='text') td.textContent=fmtNum(sums[col.key]);
    tr.appendChild(td);
  });
  tfootD.appendChild(tr);
}

/* ================= 月份切换 ================= */
function setMonth(y,m){
  cur={y:y,m:m};
  loadMonth();
  monthText.textContent=y+'年'+m+'月';
  calViewY=y;
  renderTable();
  renderCal();
}
$('prevBtn').addEventListener('click', function(){
  var y=cur.y, m=cur.m-1;
  if(m===0){ m=12; y--; }
  setMonth(y,m);
});
$('nextBtn').addEventListener('click', function(){
  var y=cur.y, m=cur.m+1;
  if(m===13){ m=1; y++; }
  setMonth(y,m);
});

/* ================= 日历弹层 ================= */
function toggleCal(){ calPop.classList.toggle('hidden'); if(!calPop.classList.contains('hidden')) renderCal(); }
$('monthLabel').addEventListener('click', toggleCal);
document.addEventListener('click', function(ev){
  if(!$('monthNav').contains(ev.target)) calPop.classList.add('hidden');
});
document.addEventListener('keydown', function(ev){
  if(ev.key==='Escape'){
    if($('detailModal')) closeDetail();
    else calPop.classList.add('hidden');
  }
});
$('calPrevY').addEventListener('click', function(){ calViewY--; renderCal(); });
$('calNextY').addEventListener('click', function(){ calViewY++; renderCal(); });
$('calToday').addEventListener('click', function(){
  setMonth(today.getFullYear(), today.getMonth()+1);
  calPop.classList.add('hidden');
});
function renderCal(){
  $('calYear').textContent=calViewY+'年';
  var grid=$('calGrid');
  grid.innerHTML='';
  for(var m=1;m<=12;m++){
    (function(mm){
      var btn=document.createElement('button');
      btn.className='cal-month';
      btn.textContent=mm+'月';
      if(mm===cur.m && calViewY===cur.y) btn.classList.add('selected');
      if(mm===today.getMonth()+1 && calViewY===today.getFullYear()) btn.classList.add('today');
      btn.addEventListener('click', function(){
        setMonth(calViewY, mm);
        calPop.classList.add('hidden');
      });
      grid.appendChild(btn);
    })(m);
  }
}

/* ================= 成员管理 ================= */
$('addBtn').addEventListener('click', function(){
  var raw=prompt('输入成员姓名（多个可用逗号、顿号或空格分隔）：');
  if(raw===null) return;
  var names=raw.split(/[,，、;；\s]+/).map(function(s){return s.trim().slice(0,20);}).filter(Boolean);
  if(names.length===0) return;
  var added=[], dup=[];
  names.forEach(function(n){
    if(roster.indexOf(n)>-1) dup.push(n);
    else { roster.push(n); added.push(n); }
  });
  persistRoster();
  renderTable();
  if(added.length) flashSaved();
  var msg='';
  if(added.length) msg+='已添加：'+added.join('、')+'（'+added.length+' 人）';
  if(dup.length) msg+=(msg?'\n':'')+'已存在，跳过：'+dup.join('、');
  if(msg) alert(msg);
  /* 聚焦新成员第一格 */
  if(added.length){
    var trs=tbody.querySelectorAll('tr');
    var tr=trs[roster.indexOf(added[0])];
    if(tr){ var inp=tr.querySelector('input[type=number]'); if(inp){ inp.focus(); inp.select(); } }
  }
});
function removePerson(name){
  if(!confirm('确定删除「'+name+'」吗？\n删除后将同时清空该成员在所有月份的数据。')) return;
  roster=roster.filter(function(n){ return n!==name; });
  persistRoster();
  /* 清理所有月份中该成员的数据 */
  Object.keys(localStorage).forEach(function(k){
    if(/^kq:\d{4}-\d{2}$/.test(k)){
      var d=loadJSON(k, null);
      if(d && d[name]!==undefined){
        delete d[name];
        if(Object.keys(d).length) saveJSON(k,d); else localStorage.removeItem(k);
      }
    }
  });
  renderTable();
  flashSaved();
}

/* ================= 导出 CSV（带 BOM，Excel 可直接打开） ================= */
$('exportBtn').addEventListener('click', function(){
  var rows=[];
  var head=['姓名'].concat(COLS.map(function(c){ return c.label; }));
  rows.push(head);
  roster.forEach(function(name){
    var rec=monthData[name]||{};
    rows.push([name].concat(COLS.map(function(c){
      var v=rec[c.key];
      return (v===undefined||v===null)?'':v;
    })));
  });
  var csv=rows.map(function(r){
    return r.map(function(v){
      v=String(v);
      return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
    }).join(',');
  }).join('\r\n');
  var blob=new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  downloadBlob(blob, '考勤汇总-'+cur.y+'年'+cur.m+'月.csv');
});

/* ================= 导出工具 ================= */
function downloadBlob(blob, filename){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}
function xmlEsc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------- 导出 Excel（SpreadsheetML 格式，无需联网，Excel/WPS 可直接打开） ---------- */
$('exportXlsBtn').addEventListener('click', function(){
  var rows=[];
  var head=['姓名'].concat(COLS.map(function(c){ return c.label; }));
  rows.push(head);
  roster.forEach(function(name){
    var rec=monthData[name]||{};
    rows.push([name].concat(COLS.map(function(c){
      var v=rec[c.key];
      return (v===undefined||v===null)?'':v;
    })));
  });
  var xml='<?xml version="1.0" encoding="UTF-8"?>\n'+
    '<?mso-application progid="Excel.Sheet"?>\n'+
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
    '<Styles><Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#DCE6F5" ss:Pattern="Solid"/></Style></Styles>'+
    '<Worksheet ss:Name="'+xmlEsc(cur.y+'年'+cur.m+'月')+'"><Table>';
  xml+='<Column ss:Width="90"/>';
  COLS.forEach(function(c){ xml+='<Column ss:Width="'+(c.type==='text'?200:70)+'"/>'; });
  rows.forEach(function(r,ri){
    xml+='<Row>';
    r.forEach(function(v){
      var isNum = (typeof v==='string' && v!=='' && !isNaN(parseFloat(v)) && isFinite(v));
      if(v===''){ xml+='<Cell'+(ri===0?' ss:StyleID="h"':'')+'></Cell>'; }
      else if(isNum){ xml+='<Cell><Data ss:Type="Number">'+parseFloat(v)+'</Data></Cell>'; }
      else { xml+='<Cell'+(ri===0?' ss:StyleID="h"':'')+'><Data ss:Type="String">'+xmlEsc(v)+'</Data></Cell>'; }
    });
    xml+='</Row>';
  });
  xml+='</Table></Worksheet></Workbook>';
  var blob=new Blob(['﻿'+xml], {type:'application/vnd.ms-excel;charset=utf-8'});
  downloadBlob(blob, '考勤汇总-'+cur.y+'年'+cur.m+'月.xls');
});

/* ---------- 导出 PDF（调用浏览器打印 → 另存为 PDF，无需联网） ---------- */
$('exportPdfBtn').addEventListener('click', function(){
  var ps=$('printSheet');
  var head=['姓名'].concat(COLS.map(function(c){ return c.label; }));
  var html='<h1>考勤汇总 · '+cur.y+'年'+cur.m+'月</h1>'+
    '<table><thead><tr>'+head.map(function(h){ return '<th>'+xmlEsc(h)+'</th>'; }).join('')+'</tr></thead><tbody>';
  roster.forEach(function(name){
    var rec=monthData[name]||{};
    html+='<tr><td>'+xmlEsc(name)+'</td>'+COLS.map(function(c){
      var v=rec[c.key];
      v=(v===undefined||v===null)?'':v;
      return '<td>'+xmlEsc(v)+'</td>';
    }).join('')+'</tr>';
  });
  html+='</tbody></table>'+
    '<p class="ps-meta">导出时间：'+new Date().toLocaleString('zh-CN',{hour12:false})+'</p>';
  ps.innerHTML=html;
  window.print();
});

/* ================= 初始化 ================= */
renderCal();
setMonth(cur.y, cur.m);
})();
